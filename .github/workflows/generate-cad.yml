name: Generate V3.1 CAD outputs

on:
  push:
    branches: [main]
    paths:
      - 'source_parts_v3_1/**'
      - 'build_v3_1.py'
      - 'requirements.txt'
      - '.github/workflows/generate-cad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate V3.1 STL, STEP and DXF outputs
        run: python build_v3_1.py

      - name: Upload complete generated CAD artifact
        uses: actions/upload-artifact@v4
        with:
          name: v3-1-generated-cad
          path: generated/
          if-no-files-found: error

      - name: Commit generated CAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated/ CAD_SOURCE_make_v3_1.py
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
          else
            git commit -m "Generate V3.1 clearance-first CAD outputs"
            git push
          fi
